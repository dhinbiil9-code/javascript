<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Local Storage Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .app {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 100px;
            margin-bottom: 10px;
        }

        button {
            margin: 5px;
            padding: 8px 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="app">
        <h2>📝 Notes App</h2>
        <textarea id="note" placeholder="Write something..."></textarea>
        <br>
        <button onclick="saveNote()">Save</button>
        <button onclick="clearNote()">Clear</button>
    </div>

    <script>
        const textarea = document.getElementById("note");

        // Load saved note when page opens
        window.onload = function () {
            const savedNote = localStorage.getItem("myNote");
            if (savedNote) {
                textarea.value = savedNote;
            }
        };

        // Save note to localStorage
        function saveNote() {
            localStorage.setItem("myNote", textarea.value);
            alert("Note saved!");
        }

        // Clear note from localStorage
        function clearNote() {
            localStorage.removeItem("myNote");
            textarea.value = "";
            alert("Note cleared!");
        }
    </script>

</body>

</html>
