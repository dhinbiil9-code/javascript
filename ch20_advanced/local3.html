<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Notes App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            transition: 0.3s;
        }

        .app {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            transition: 0.3s;
        }

        textarea {
            width: 100%;
            height: 100px;
            margin-bottom: 10px;
        }

        button {
            margin: 5px;
            padding: 8px 12px;
            cursor: pointer;
        }

        /* 🌙 Dark Mode */
        body.dark {
            background: #121212;
            color: #fff;
        }

        body.dark .app {
            background: #1e1e1e;
        }

        body.dark textarea {
            background: #333;
            color: #fff;
            border: 1px solid #555;
        }
    </style>
</head>

<body>

    <div class="app">
        <h2>📝 Notes App</h2>
        <textarea id="note" placeholder="Write something..."></textarea>
        <br>
        <button onclick="saveNote()">Save</button>
        <button onclick="clearNote()">Clear</button>
        <br>
        <button id="themeBtn" onclick="toggleTheme()">🌙 Dark Mode</button>
    </div>

    <script>
        const textarea = document.getElementById("note");
        const themeBtn = document.getElementById("themeBtn");

        // Apply theme
        function applyTheme(theme) {
            if (theme === "dark") {
                document.body.classList.add("dark");
                themeBtn.textContent = "☀️ Light Mode";
            } else {
                document.body.classList.remove("dark");
                themeBtn.textContent = "🌙 Dark Mode";
            }
        }

        // Load everything on start
        window.onload = function () {
            // Load note
            const savedNote = localStorage.getItem("myNote");
            if (savedNote) textarea.value = savedNote;

            // Load theme (or detect system preference)
            let savedTheme = localStorage.getItem("theme");

            if (!savedTheme) {
                const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
                savedTheme = prefersDark ? "dark" : "light";
            }

            applyTheme(savedTheme);
        };

        function saveNote() {
            localStorage.setItem("myNote", textarea.value);
        }

        function clearNote() {
            localStorage.removeItem("myNote");
            textarea.value = "";
        }

        function toggleTheme() {
            const isDark = document.body.classList.contains("dark");
            const newTheme = isDark ? "light" : "dark";

            applyTheme(newTheme);
            localStorage.setItem("theme", newTheme);
        }
    </script>

</body>

</html>
